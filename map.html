<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Map of bus stops · Custom Metro Transit posters</title>
  <link rel="icon" type="image/png" href="data/metrologo-mark.png" />
  <link rel="shortcut icon" type="image/png" href="data/metrologo-mark.png" />
  <link rel="apple-touch-icon" href="data/metrologo-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="map-body">
  <nav class="site-nav">
    <a class="brand" href="index.html"><img src="data/metrologo-mark.png" alt="" /> Custom Metro Transit posters</a>
    <a href="timetable.html">Timetable generator</a>
    <a href="stoplist.html">Stop list generator</a>
    <a href="hybrid.html">Hybrid generator</a>
  </nav>
  <div class="map-layout">
    <aside class="map-panel">
      <h1>View map of bus stops</h1>
      <p class="lead">Hover or click a stop for its name, number, and routes.</p>
      <label class="field">
        <span>Stop or address</span>
        <input id="q" type="search" autocomplete="off" placeholder="0716, University at N Orchard, or a street address" disabled />
      </label>
      <label class="field map-filter">
        <span>Route</span>
        <select id="route-filter" disabled>
          <option value="">All routes</option>
        </select>
      </label>
      <details class="map-advanced">
        <summary>Advanced</summary>
        <label class="check"><input type="checkbox" id="filter-shelter" /> Sheltered stops only</label>
        <label class="check"><input type="checkbox" id="filter-multi" /> Multiple non-school routes</label>
        <fieldset class="jur-set">
          <legend>Jurisdiction</legend>
          <div id="jur-list"></div>
        </fieldset>
      </details>
      <div id="results" class="results" hidden></div>
      <p class="map-status" id="status">Loading stops…</p>
      <button type="button" class="map-clear" id="clear">Clear</button>
    </aside>
    <div id="map"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="map.js"></script>
</body>
</html>
