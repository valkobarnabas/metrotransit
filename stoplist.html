<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stop list generator · Custom Metro Transit posters</title>
  <link rel="icon" type="image/png" href="data/metrologo-mark.png" />
  <link rel="shortcut icon" type="image/png" href="data/metrologo-mark.png" />
  <link rel="apple-touch-icon" href="data/metrologo-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="index.html"><img src="data/metrologo-mark.png" alt="" /> Custom Metro Transit posters</a>
    <a href="timetable.html">Timetable generator</a>
    <a href="stoplist.html" aria-current="page">Stop list generator</a>
  </nav>
  <main class="box">
    <h1>Stop list generator</h1>
    <p class="lead">View what stops are served from routes leaving from any stop.</p>

    <label class="field">
      <span>Stop</span>
      <input id="q" type="search" autocomplete="off" placeholder="0716 or University at N Orchard" />
    </label>
    <div id="results" class="results" hidden></div>

    <section id="picked" class="picked" hidden>
      <div class="picked-name" id="picked-name"></div>
      <div class="picked-meta" id="picked-meta"></div>

      <div class="row">
        <label class="check"><input type="checkbox" id="noschool" checked /> Exclude school extras</label>
        <label class="check"><input type="checkbox" id="headboard" /> Headboard</label>
      </div>
      <div id="routes" class="routes"></div>

      <button type="button" id="go">Generate poster</button>
    </section>
    <p id="err" class="err" hidden></p>
  </main>

  <section id="out" class="out" hidden>
    <div class="out-bar">
      <button type="button" id="open">Open HTML in new tab</button>
      <button type="button" id="save">Download HTML</button>
    </div>
    <iframe id="preview" title="Poster preview"></iframe>
  </section>

  <script src="served.js"></script>
  <script src="stoplist.js"></script>
</body>
</html>
